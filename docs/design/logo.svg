<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 216 64" width="216" height="64" role="img" aria-labelledby="km-logo-title">
  <title id="km-logo-title">万事大吉</title>
  <style>
    /* Optional blink: one quick blink every ~7 s. Delete this block for a static logo. */
    .km-eyes { transform-box: fill-box; transform-origin: center; animation: km-blink 7s ease-in-out infinite; }
    @keyframes km-blink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    @media (prefers-reduced-motion: reduce) { .km-eyes { animation: none; } }
  </style>
  <!-- Mark (same geometry as logo-mark.svg) -->
  <path fill="#0A0A0A" d="M33 5C49 5 59.5 15.5 59.5 31.5C59.5 48 48.5 59.5 31.5 59.5C15.5 59.5 4.5 49 4.5 32.5C4.5 15.5 17 5 33 5Z"/>
  <ellipse fill="#30B0C7" cx="46.5" cy="15.5" rx="4.2" ry="2.4" transform="rotate(35 46.5 15.5)"/>
  <g class="km-eyes" fill="#FFFFFF">
    <ellipse cx="24.5" cy="32" rx="5" ry="8.2"/>
    <ellipse cx="40.5" cy="32" rx="5" ry="8.2"/>
  </g>
  <!-- Wordmark「万事大吉」(brand name, never translated).
       Gap mark→text = 14 (≈ 0.22 × mark height). Font stack below is for preview only:
       convert the text to outlines (e.g. in Figma/Illustrator with PingFang SC Semibold/Bold
       or Source Han Sans SC Bold) before shipping for pixel-perfect output. -->
  <text x="78" y="43" fill="#0A0A0A" font-family="'PingFang SC', 'HarmonyOS Sans SC', 'Source Han Sans SC', 'Noto Sans CJK SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700" letter-spacing="1.5">万事大吉</text>
</svg>
